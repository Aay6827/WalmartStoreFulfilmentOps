global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: fulfilment
    metrics_path: /metrics
    static_configs:
      - targets:
          - order-service:8000
          - inventory-service:8000
          - slot-service:8000
          - returns-service:8000
          - api-gateway:8000

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]