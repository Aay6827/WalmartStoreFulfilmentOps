name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        service:
          - inventory-service
          - slot-service
          - returns-service
          - order-service
          - api-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: pytest (${{ matrix.service }})
        working-directory: services/${{ matrix.service }}
        run: python -m pytest -q

  monitoring-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: promtool check config, check rules, unit-test the alerts
        run: |
          promtool() {
            docker run --rm --entrypoint promtool -v "$PWD/infra/prometheus:/etc/prometheus:ro" prom/prometheus:latest "$@"
          }
          promtool check config /etc/prometheus/prometheus.yml
          promtool check rules /etc/prometheus/rules/slo.rules.yml /etc/prometheus/rules/service.rules.yml
          promtool test rules /etc/prometheus/tests/alerts.test.yml

  e2e:
    needs: [unit-tests, monitoring-rules]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test-script dependency
        run: pip install httpx
      - name: Build images (sequentially, sharing the cached dependency layer)
        run: |
          for s in inventory-service slot-service returns-service order-service api-gateway; do
            docker compose build "$s"
          done
      - name: Start the stack
        run: docker compose up -d --wait --wait-timeout 180
      - name: Smoke test through the gateway
        run: python scripts/smoke.py
      - name: Concurrency test against real Postgres
        run: python scripts/concurrency_test.py
      - name: Verify monitoring (Prometheus targets and rules, Grafana dashboard)
        run: python scripts/verify_monitoring.py
      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v